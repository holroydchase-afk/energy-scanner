name: ci
# Lint, typecheck, unit and browser tests on every pull request, before anything reaches Pages.
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't install Chromium (Oct 31).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/check-agents.sh
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
