name: codeql
# Studio security kit (studio-agents templates/security). CodeQL code scanning;
# results show under Security → Code scanning. Free on public repos. If the repo
# already uses CodeQL "default setup" in Settings, delete this file or turn that off.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
