name: security
# Studio security kit (studio-agents templates/security). Three checks:
# - secrets: gitleaks over the full git history, so a key that was committed
#   and later deleted still fails. Add a .gitleaks.toml at the repo root for
#   false positives.
# - privacy: no personal emails, phone numbers, claude.ai artifact links or
#   trigger ids in tracked files. Allow a known-safe match with a regex line
#   in .privacy-allow.
# - dependencies: on PRs, fails when a change adds a dependency with a known
#   high or critical vulnerability.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          VERSION: 8.21.2
          SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --redact --no-banner --exit-code 1
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no personal data in tracked files
        run: python3 .github/privacy-scan.py
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
